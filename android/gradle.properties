# JVM: 2 GB is enough for this module and keeps CI runners happy.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# ---------------------------------------------------------------------------
# AGP 9 DSL
# ---------------------------------------------------------------------------
# AGP 9 turns on a new `android { }` DSL plus built-in Kotlin by default, and
# the `org.jetbrains.kotlin.android` plugin is incompatible with it. AGP
# offers two routes; we take the escape hatch rather than built-in Kotlin
# because KSP (which Room and Hilt both require here) is not yet wired for
# built-in Kotlin, and losing annotation processing would cost far more than
# this flag.
#
# This is a known, dated piece of debt: the opt-out is removed in AGP 10, so
# migrating to built-in Kotlin is tracked in docs/ROADMAP.md.
android.newDsl=false
android.builtInKotlin=false
android.nonTransitiveRClass=true

kotlin.code.style=official
