[project]
name = "fishmate-backend"
version = "0.1.0"
description = "FishMate AI — backend: auth, constrained Gemini Live token minting, fishing tools & memory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    # Alembic runs synchronously, so a sync driver is required wherever
    # migrations run — including the production image.
    "psycopg2-binary>=2.9.10",
    "aiosqlite>=0.20.0",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.1",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "respx>=0.22.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "S"]
ignore = ["S101", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's asyncio layer runs DB work inside greenlets; without this,
# coverage silently under-reports any code path that awaits the database.
concurrency = ["greenlet", "thread"]
omit = ["app/__init__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
